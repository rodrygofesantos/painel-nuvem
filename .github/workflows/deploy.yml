name: Deploy Painel Nuvem no AKS

# Gatilhos do workflow:
# - push na branch main: build, push da imagem e implantação no AKS Automatic.
# - workflow_dispatch: permite disparar manualmente pela guia Actions.
# - pull_request: executa apenas validação (instalação, testes e build local
#   da imagem), sem publicar nada no Azure. Isso protege o cluster contra
#   implantações vindas de branches ainda não revisadas.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

# Permissão global de leitura. O token OIDC é liberado somente no job de
# implantação, portanto pull requests não recebem id-token: write.
permissions:
  contents: read

# Evita que duas implantações rodem ao mesmo tempo para o mesmo branch.
# Uma nova execução espera a anterior terminar em vez de cancelá-la,
# preservando o histórico de implantações.
concurrency:
  group: deploy-painel-nuvem-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'painel-nuvem' }}
  KUBERNETES_NAMESPACE: ${{ vars.KUBERNETES_NAMESPACE || 'aula-nuvem' }}

jobs:
  # ---------------------------------------------------------------------
  # Job 1: validação. Executa sempre (push, pull_request e workflow_dispatch).
  # Garante que o código instala, passa nos testes e que a imagem Docker
  # consegue ser construída antes de qualquer publicação no Azure.
  # ---------------------------------------------------------------------
  validar:
    name: Validar aplicação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Executar testes automatizados
        run: npm test

      - name: Construir imagem Docker (validação local)
        run: docker build -t "${{ env.IMAGE_NAME }}:validacao" .

  # ---------------------------------------------------------------------
  # Job 2: implantação. Só executa em push na branch main ou quando
  # disparado manualmente (workflow_dispatch) — nunca em pull requests.
  # ---------------------------------------------------------------------
  implantar:
    name: Publicar imagem e implantar no AKS
    needs: validar
    # A credencial federada confia exclusivamente na ref refs/heads/main.
    # Disparos manuais feitos a partir de outra ref executam só a validação.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v5

      # Autenticação no Azure usando OIDC: o GitHub Actions troca um token
      # de curta duração com o Microsoft Entra ID, sem usar client secret
      # nem senha armazenados no repositório.
      - name: Validar secrets e variáveis do Azure no GitHub
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_AKS_CLUSTER: ${{ vars.AZURE_AKS_CLUSTER }}
          KUBERNETES_NAMESPACE: ${{ vars.KUBERNETES_NAMESPACE }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$AZURE_CLIENT_ID" ] || missing+=("AZURE_CLIENT_ID")
          [ -n "$AZURE_TENANT_ID" ] || missing+=("AZURE_TENANT_ID")
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || missing+=("AZURE_SUBSCRIPTION_ID")
          [ -n "$AZURE_ACR_NAME" ] || missing+=("AZURE_ACR_NAME")
          [ -n "$AZURE_RESOURCE_GROUP" ] || missing+=("AZURE_RESOURCE_GROUP")
          [ -n "$AZURE_AKS_CLUSTER" ] || missing+=("AZURE_AKS_CLUSTER")
          [ -n "$KUBERNETES_NAMESPACE" ] || missing+=("KUBERNETES_NAMESPACE")
          [ -n "$IMAGE_NAME" ] || missing+=("IMAGE_NAME")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Configuração incompleta no GitHub para deploy na Azure." >&2
            echo "Defina os seguintes secrets/variables antes de executar o workflow:" >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi

          if [ "$KUBERNETES_NAMESPACE" != "aula-nuvem" ]; then
            echo "KUBERNETES_NAMESPACE deve ser 'aula-nuvem'." >&2
            exit 1
          fi

          if [ "$IMAGE_NAME" != "painel-nuvem" ]; then
            echo "IMAGE_NAME deve ser 'painel-nuvem'." >&2
            exit 1
          fi

          echo "Configuração do Azure encontrada. Prosseguindo com o login."

      - name: Autenticar no Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Descobrir endereço do Azure Container Registry
        run: |
          set -euo pipefail
          LOGIN_SERVER=$(az acr show \
            --name "${{ vars.AZURE_ACR_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query loginServer \
            --output tsv)
          echo "Endereço do ACR: $LOGIN_SERVER"
          echo "ACR_LOGIN_SERVER=$LOGIN_SERVER" >> "$GITHUB_ENV"

      - name: Autenticar no Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Definir tag imutável da imagem
        run: echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Construir imagem da aplicação
        run: |
          set -euo pipefail
          docker build \
            -t "$ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:$IMAGE_TAG" \
            .

      - name: Publicar imagem no Azure Container Registry
        run: docker push "$ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:$IMAGE_TAG"

      - name: Instalar kubelogin para autenticação Entra no AKS
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: "v0.2.18"

      - name: Obter credenciais do cluster AKS Automatic
        run: |
          set -euo pipefail
          az aks get-credentials \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_AKS_CLUSTER }}" \
            --overwrite-existing
          kubelogin convert-kubeconfig --login azurecli

      - name: Preparar manifestos Kubernetes com namespace e imagem
        run: |
          set -euo pipefail
          export NAMESPACE="${{ env.KUBERNETES_NAMESPACE }}"
          MANIFEST_DIR="$RUNNER_TEMP/painel-nuvem-manifests"
          mkdir -p "$MANIFEST_DIR"
          echo "MANIFEST_DIR=$MANIFEST_DIR" >> "$GITHUB_ENV"
          sed "s|NAMESPACE_PLACEHOLDER|$NAMESPACE|g" manifests/configmap.yaml > "$MANIFEST_DIR/configmap.yaml"
          sed "s|NAMESPACE_PLACEHOLDER|$NAMESPACE|g" manifests/service.yaml > "$MANIFEST_DIR/service.yaml"
          sed \
            -e "s|NAMESPACE_PLACEHOLDER|$NAMESPACE|g" \
            -e "s|IMAGE_PLACEHOLDER|$ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:$IMAGE_TAG|g" \
            manifests/deployment.yaml > "$MANIFEST_DIR/deployment.yaml"

          if grep -R -E 'NAMESPACE_PLACEHOLDER|IMAGE_PLACEHOLDER' "$MANIFEST_DIR"; then
            echo "Um placeholder não foi substituído nos manifestos." >&2
            exit 1
          fi

          echo "Manifestos preparados para o namespace: $NAMESPACE"

      - name: Aplicar ConfigMap
        run: kubectl apply -f "$MANIFEST_DIR/configmap.yaml"

      - name: Aplicar Deployment
        run: kubectl apply -f "$MANIFEST_DIR/deployment.yaml"

      - name: Aplicar Service
        run: kubectl apply -f "$MANIFEST_DIR/service.yaml"

      - name: Acompanhar o rollout do Deployment
        run: |
          kubectl rollout status deployment/painel-nuvem \
            -n "${{ env.KUBERNETES_NAMESPACE }}" \
            --timeout=180s

      - name: Exibir estado dos Pods
        run: kubectl get pods -n "${{ env.KUBERNETES_NAMESPACE }}" -o wide

      - name: Exibir estado do Service
        run: kubectl get service painel-nuvem -n "${{ env.KUBERNETES_NAMESPACE }}"

      - name: Apresentar endpoint externo (quando já disponível)
        run: |
          set +e
          IP_EXTERNO=$(kubectl get service painel-nuvem \
            -n "${{ env.KUBERNETES_NAMESPACE }}" \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          if [ -n "$IP_EXTERNO" ]; then
            echo "Aplicação disponível em: http://$IP_EXTERNO"
          else
            echo "O IP externo ainda não foi atribuído pelo Azure."
            echo "Execute 'kubectl get service painel-nuvem -n ${{ env.KUBERNETES_NAMESPACE }} --watch' para acompanhar."
          fi

      - name: Gravar resumo da implantação
        if: always()
        run: |
          {
            echo "## Resumo da implantação — painel-nuvem"
            echo ""
            echo "- **Imagem publicada:** \`$ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:$IMAGE_TAG\`"
            echo "- **Namespace:** \`${{ env.KUBERNETES_NAMESPACE }}\`"
            echo "- **Cluster:** \`${{ vars.AZURE_AKS_CLUSTER }}\`"
            echo "- **Commit:** \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
